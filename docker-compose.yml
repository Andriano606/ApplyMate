services:
  postgres:
    image: postgres:17-alpine
    # Shared by ALL Conductor worktrees → must hold several worktrees' pools at once
    # (puma threads + solid_queue workers + cable/cache pollers per worktree). The
    # default max_connections=100 is far too low; one worktree's primary pool alone
    # can exceed it, which exhausts Postgres and makes every worktree's requests block
    # on connection checkout (progressive slowdown → freeze). ~8MB/conn → 500 ≈ 4GB
    # worst case (rarely all active at once).
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=256MB"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5434 avoids conflicting with other local Postgres/MySQL on 5432/5433.
      # Container still listens on 5432; DB_PORT (read by config/database.yml) must match
      # the host side. Compose reads DB_PORT from .env in the project directory.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  minio:
    # MinIO no longer publishes images to Docker Hub (minio/minio, minio/mc → "pull access
    # denied"), so use the pgsty community build. It ships both the server and `mc` (used by
    # the healthcheck and createbuckets). Pinned: keep in sync with config/deploy.staging.yml.
    image: &minio_image pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: *minio_image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/apply-mate-dev;
        mc anonymous set download local/apply-mate-dev;
      "

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki:/etc/loki
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./docker/promtail:/etc/promtail
      - ./log:/logs:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - ./docker/grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
  minio_data:
  loki_data:
  grafana_data:
