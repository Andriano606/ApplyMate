<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Custom Widgets</title></head>
<body>
  <h1>Apply now</h1>
  <div class="custom-form">
    <span id="country-label">Country of residence</span>
    <div role="combobox" id="country-widget" aria-labelledby="country-label" aria-required="true" tabindex="0"></div>

    <div contenteditable="true" id="pitch-editor" aria-label="Why do you want to join?">My pitch</div>

    <button type="submit">Apply</button>
  </div>
</body>
</html>
