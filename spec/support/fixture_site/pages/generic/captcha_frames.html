<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lever-like form with an invisible hCaptcha</title>
</head>
<body>
  <!-- Lever: ONE invisible hCaptcha. Its enclave iframe (cross-origin, hcaptcha in the src) covers the page with
       visibility:hidden and frames the challenge, whose controls compute themselves visible. -->
  <form id="apply" action="/submit" method="post">
    <label for="name">Full name</label> <input id="name" name="name" type="text">
    <label for="email">Email</label> <input id="email" name="email" type="email">
    <button type="submit">Submit application</button>
  </form>
  <iframe id="hcaptcha-enclave" sandbox="allow-scripts allow-same-origin"
          title="Widget containing checkbox for hCaptcha security challenge"
          src="{{ALT_ORIGIN}}/generic/hcaptcha/enclave.html#frame=enclave"
          style="position: fixed; top: 0px; left: 0px; width: 100%; height: 100%; z-index: 2147483647; visibility: hidden;"></iframe>
</body>
</html>
