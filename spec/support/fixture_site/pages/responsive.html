<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Responsive form</title>
    <style>
      .mobile-only { display: none; }
    </style>
  </head>
  <body>
    <form id="apply">
      <div class="mobile-only">
        <input id="email_mobile" name="email" type="email" />
      </div>
      <div class="desktop">
        <input id="email_desktop" name="email" type="email" />
      </div>
    </form>
  </body>
</html>
