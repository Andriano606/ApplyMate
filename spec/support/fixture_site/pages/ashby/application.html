    <script>
      const HEAR_OPTIONS = [
        'Word of mouth', 'LinkedIn', 'Facebook', 'Instagram', 'Twitter / X', 'YouTube', 'Google search', 'Job board',
        'DOU', 'Djinni', 'Glassdoor', 'Indeed', 'Referral from a Preply employee', 'Event or conference', 'Other',
      ];
      // crypto.randomUUID needs a secure context; the fixture is served over plain http.
      const uuid = () =>
        'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
          const r = (Math.random() * 16) | 0;
          return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
        });

      function render() {
        const instance = uuid();
        const form = document.getElementById('form');
        form.appendChild(document.getElementById('form-template').content.cloneNode(true));
        form.querySelectorAll('[data-instance-name]').forEach((el) => (el.name = `${instance}_${el.dataset.instanceName}`));
        form.querySelectorAll('[data-instance-id]').forEach((el) => (el.id = `${instance}_${el.dataset.instanceId}`));
        form.querySelectorAll('[data-instance-for]').forEach((el) => (el.htmlFor = `${instance}_${el.dataset.instanceFor}`));

        form.querySelectorAll('.upload-trigger, .autofill-trigger').forEach((button) =>
          button.addEventListener('click', () => button.parentElement.querySelector('input[type=file]').click()),
        );
        const resume = document.getElementById('_systemfield_resume');
        resume.addEventListener('change', () => {
          resume.parentElement.querySelector('._fileName_t5y1d_40').textContent = Array.from(resume.files, (f) => f.name).join(', ');
        });

        form.querySelectorAll('._yesno_hq5b2_1 button').forEach((button) =>
          button.addEventListener('click', () => {
            button.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
          }),
        );

        setUpCombobox(form.querySelector('.ashby-application-form-input-autocomplete'));

        form.querySelector('.ashby-application-form-submit-button').addEventListener('click', submit);
      }

      function setUpCombobox(input) {
        const wrapper = input.parentElement;
        const chips = wrapper.parentElement.querySelector('._chips_d7ago_70');
        let listbox = null;
        const close = () => {
          if (listbox) listbox.remove();
          listbox = null;
          input.setAttribute('aria-expanded', 'false');
        };
        const open = () => {
          close();
          const filter = input.value.trim().toLowerCase();
          listbox = document.createElement('div');
          listbox.setAttribute('role', 'listbox');
          listbox.id = ':r0:';
          listbox.className = '_listbox_d7ago_60';
          HEAR_OPTIONS.filter((label) => label.toLowerCase().includes(filter)).forEach((label, index) => {
            const option = document.createElement('div');
            option.setAttribute('role', 'option');
            option.id = `:r0:-option-${index}`;
            option.setAttribute('aria-selected', 'false');
            option.textContent = label;
            option.addEventListener('mousedown', (event) => event.preventDefault());
            option.addEventListener('click', () => {
              chips.innerHTML = '';
              const chip = document.createElement('div');
              chip.className = '_chip_d7ago_80';
              chip.textContent = label;
              chips.appendChild(chip);
              input.value = '';
              close();
            });
            listbox.appendChild(option);
          });
          wrapper.appendChild(listbox);
          input.setAttribute('aria-expanded', 'true');
        };
        // A click on the input or the toggle does NOT open the menu (live probe); only ArrowDown does.
        input.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowDown') {
            event.preventDefault();
            if (!listbox) open();
          } else if (event.key === 'Escape') close();
        });
        input.addEventListener('input', () => {
          if (listbox) open();
        });
      }

      async function submit() {
        const form = document.getElementById('form');
        const values = {};
        form.querySelectorAll('[data-field-path]').forEach((entry) => {
          const path = entry.dataset.fieldPath;
          const text = entry.querySelector('input[type=text], input[type=email], input[type=tel], input[type=number], textarea');
          const file = entry.querySelector('input[type=file]');
          const chip = entry.querySelector('._chip_d7ago_80');
          const radio = entry.querySelector('input[type=radio]:checked');
          const pressed = entry.querySelector('button[aria-pressed=true]');
          const boxes = Array.from(entry.querySelectorAll('input[type=checkbox]:checked'), (box) => box.name);
          if (text) values[path] = text.value;
          else if (file) values[path] = file.files.length ? file.files[0].name : null;
          else if (chip) values[path] = chip.textContent;
          else if (radio) values[path] = radio.value;
          else if (pressed) values[path] = pressed.textContent === 'Yes';
          else if (boxes.length) values[path] = boxes;
        });
        const response = await fetch('/ashby/api/non-user-graphql?op=SubmitApplicationForm', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ operationName: 'SubmitApplicationForm', variables: { values } }),
        });
        const json = await response.json();
        if (json.data && json.data.submitApplicationForm && json.data.submitApplicationForm.success) {
          form.innerHTML =
            '<div class="ashby-application-form-success-container"><h2>Thank you for applying</h2>' +
            '<p>Your application was successfully submitted. We will be in touch.</p></div>';
        }
      }

      setTimeout(render, 400);
    </script>
