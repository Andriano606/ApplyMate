<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Careers at Preply | Apply</title>
    <!-- A company page whose Ashby embed already shows the application form (cross-origin iframe on the alt origin):
         ReachForm without a canonical navigation must find the form root inside iframe#ashby_embed_iframe. -->
    <style>
      body { font-family: sans-serif; margin: 0; }
      iframe { width: 100%; height: 2600px; border: 0; }
    </style>
  </head>
  <body>
    <h1>Customer Care Team Lead</h1>
    <iframe id="ashby_embed_iframe" title="Ashby Job Board" src="{{ALT_ORIGIN}}/ashby/application.html?embed=js"></iframe>
  </body>
</html>
