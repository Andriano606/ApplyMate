# Label lexicon of Apply::Operation::Answer::Classify (design §8.1, uk / en / ru).
#
# semantics: ordered; the FIRST semantic with a matching regex wins (case-insensitive, matched against the field label,
#            then the placeholder). Sensitive semantics come first so that "I agree to receive our newsletter" is a
#            marketing opt-in and never a consent. A regex may appear under one semantic only (spec-enforced).
#            Classify normalizes the text first (Classify::TRAILER: squished, trailing `* : . ? !` and a trailing
#            "(...)" note removed), so "Phone number (with country code) *" is matched as "Phone number".
#
# Precision over recall. A profile-fact semantic (names, email, phone, location) is filled from the profile at
# confidence 1.0 and a consent is affirmed under the default auto_consent, neither of which is a review reason. So
# those patterns are ANCHORED to the whole label (`^...$`): "Are you open to relocation?" must not be a location,
# "Describe your mobile development experience" must not be a phone, "Name of your current employer" must not be
# the applicant's name. consent_required names consent wording only ("I agree to the privacy policy"), never a bare
# "agree" ("Do you agree to work from the office?" is a question for the AI). An unmatched label goes to the AI
# (`other`), which sees the CV; a wrong match submits the wrong data silently.
# The sensitive semantics stay broad on purpose: a false positive there keeps a field away from the AI (decline option
# / missing_profile_fact halt), which is the safe direction.
semantics:
  # Opt-OUT wording ("I do not want to receive the newsletter"): Answer::Resolve CHECKS it, the opposite of an opt-in
  # (left unchecked). Before marketing_opt_in, which would otherwise match "newsletter" first.
  marketing_opt_out:
    - (do not|don't|не) (want|wish|хочу|бажаю)\S*.*(newsletter|marketing|promotional|розсилк|рассылк|рекламн)
    - (do not|don't) (send|e-?mail|contact|subscribe)\b.*(newsletter|marketing|promotional|offers)
    - не (надсилай|надсилат|присилай|присылат|отправлят|підписуват|подписыват)\S*.*(розсилк|рассылк|рекламн|новин|новост)
    # A whole-label "Unsubscribe" / "Opt out (of marketing emails)" only: an opt-in or consent text that adds "you can
    # unsubscribe / opt out at any time", or an EEO note "you may opt out of answering", is NOT an opt-out.
    - ^(unsubscribe|opt[- ]?out)( (me )?(of|from) .*(newsletter|marketing|promotional|e-?mails?|communications?|mailing))?$
  marketing_opt_in:
    - newsletter
    - marketing (e-?mails?|communications?|messages?|materials?|updates|offers)
    - promotional (e-?mails?|communications?|messages?|materials?|offers)
    - розсилк
    - рекламн\S* (повідомлен|розсил|матеріал)
    - рассылк
    - рекламн\S* (сообщен|материал)
  consent_required:
    - ^gdpr$
    - gdpr (consent|notice|declaration|agreement|statement)
    - privacy (notice|policy|statement)
    - consent (to|for) (the )?(processing|storage|collection|use of|privacy|terms|data)
    - consent$
    - i (agree|consent) to (the )?(terms|privacy|processing|storage|collection|use of my|data)
    - i (acknowledge|confirm) (that )?(i have read|the (terms|privacy))
    - i have read (and (agree|accept)|the (terms|privacy))
    - terms (and|&) conditions
    - персональн\S* дан
    - (згод\S*|погоджу\S*) на обробку
    - ^згода$
    - політик\S* конфіденційн
    - согласи\S* на обработку
    - ^согласие$
    - политик\S* конфиденциальн
  demographic:
    - gender
    - ethnic
    - \brace\b
    - disabilit
    - veteran
    - sexual orientation
    - pronoun
    - nationality
    - national origin
    - \bстать\b
    - національн
    - национальн
    - инвалидн
    - \bпол\b
  legal_status:
    - work authori[sz]ation
    - authori[sz]ed to work
    - legally (authori[sz]ed|eligible)
    - right to work
    - visa
    - sponsorship
    - citizenship
    - громадянств
    - гражданств
    - дозвіл на роботу
    - віз[аи]
    - разрешение на работу
  linkedin:
    - linkedin
  github:
    - github
  cover_letter:
    - cover letter
    - motivation letter
    - супровідн
    - мотиваційн
    - сопроводительн
  salary:
    - salary
    - compensation
    - зарплат
    - заробітн
    - оплат[аи] праці
  first_name:
    - ^(your |legal |preferred )?(first|given) name$
    - ^(ваше )?ім['’ʼ]я$
    - ^(ваше )?имя$
  last_name:
    - ^(your |legal )?(last|family) name$
    - ^(your )?surname$
    - ^(ваше )?прізвище$
    - ^(ваша )?фамилия$
  full_name:
    - ^(your |legal |applicant'?s? )?(full )?name$
    - ^(first|given) (and|&) (last|family) names?$
    - ^(ваше |ваш )?(піб|фио)$
    - ^(ваше )?повне ім['’ʼ]я$
    - ^ім['’ʼ]я (та|і) прізвище$
    - ^прізвище,? ім['’ʼ]я( (та|і) по батькові)?$
    - ^(ваше )?полное имя$
    - ^имя и фамилия$
    - ^фамилия,? имя( (и )?отчество)?$
  email:
    - ^(your |work |personal |contact )?e-?mail( address)?$
    - ^(ваша )?електронн\S* пошт\S*$
    - ^(ваша )?(электронн\S* )?почта$
    - ^(ваш )?e-?mail$
  phone:
    - ^(your |contact )?(mobile |cell )?(tele)?phone( number)?$
    - ^mobile( number)?$
    - ^(ваш )?(номер )?телефон\S*$
    - ^номер (мобільного|мобильного)( телефону| телефона)?$
  # A country picker gets its own fact (Answer::ResolveFact: the `country` fact, else the last part of the location),
  # matched to the options by MatchOption; a city typed into a country typeahead matches nothing.
  country:
    - ^(your |current |home )?country( of (residence|living))?$
    - ^(ваша )?(країна|страна)( проживання| перебування| проживания| пребывания)?$
  location:
    # A bare "Country" is NOT a location (it is `country`, above): the profile's location string ("Kyiv, Ukraine")
    # typed into a country picker matches no option.
    - ^(your |current )?(location|city)( of residence)?$
    - ^(your |current |home )?address$
    - ^where are you (currently )?(located|based)$
    - ^(ваше |ваша |поточне |поточна )?(місто|локація|адреса|місцезнаходження)( проживання)?$
    - ^(ваш |ваша )?(город|адрес|локация|местоположение)( проживания)?$
# The label of a file input that IS the CV slot (Classify.cv_file?, Classify#file). Besides these, only an unlabelled
# upload or a REQUIRED one with an unknown label gets `cv`; an optional "Need to share files with us?" is `other`.
# Only a label from this list implies required (BuildFieldInventory).
cv_file:
  - resume
  - résumé
  - \bcv\b
  - curriculum vitae
  - резюме
# The label of an upload that is NOT the CV nor a cover letter (Classify#file -> `other`, never implied required):
# portfolio, "additional files", "other attachments", "Need to share files with us?".
extra_files:
  - portfolio
  - additional (files?|documents?|attachments?|materials?)
  - other (files?|documents?|attachments?)
  - supporting (files?|documents?)
  - share (any )?(files?|documents?)
  - certificates?
  - додатков\S* (файл|документ|матеріал)
  - інш\S* (файл|документ)
  - портфоліо
  - дополнительн\S* (файл|документ|материал)
  - друг\S* (файл|документ)
  - портфолио
  - сертифікат
  - сертификат
# Resume-parse / import helpers: an upload or button that autofills OTHER fields from a CV or a profile. Never a
# question of the form (BuildFieldInventory drops it): uploading into it repeats the CV and its parser overwrites
# fields while FillFields types. Matched against the field's label, question and description.
helper_controls:
  - autofill (from|with) (your |a )?(resume|cv|linkedin|profile)
  - auto-?complete (from|with) (your |a )?(resume|cv|linkedin|profile)
  - auto-?fill key (application )?fields
  - (parse|import) (from )?(your |a )?(resume|cv|linkedin)
  - apply with linkedin
  - заповнити з (резюме|linkedin)
  - заполнить из (резюме|linkedin)
# A control name / placeholder that says nothing about the question (an upload button's verb, a lone
# "Acknowledge/Confirm" checkbox, "Type here..."): BuildFieldInventory labels such a field by its question instead, and
# an optional field with nothing else to go by is dropped (each `/`-separated part must be one of these or an `affirm`
# phrase; trailing punctuation is ignored).
generic_names:
  - type here
  - start typing
  - enter text
  - your answer
  - введіть текст
  - ваша відповідь
  - почніть вводити
  - attach
  - upload
  - upload file
  - browse
  - choose file
  - select file
  - choose
  - select
  - завантажити
  - прикріпити
  - обрати файл
  - выбрать файл
  - загрузить
affirm:
  - i agree
  - i acknowledge
  - i consent
  - i accept
  - agree
  - accept
  - acknowledge # Ashby's GDPR checkbox group: "Acknowledge/Confirm" (research/live_probe.md, Preply)
  - confirm
  - 'yes' # quoted: a bare yes is YAML's boolean true
  - погоджуюсь
  - погоджуюся
  - підтверджую
  - так
  - согласен
  - подтверждаю
  - да
decline:
  - decline to self-identify
  - decline to answer
  - prefer not to say
  - prefer not to answer
  - i do not wish to answer
  - i don't wish to answer
  - не бажаю вказувати
  - не хочу вказувати
  - волію не вказувати
  - предпочитаю не указывать
